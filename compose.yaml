services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: im19
      POSTGRES_USER: im19
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U im19"]
      interval: 10s
      timeout: 5s
      retries: 5
  gateway:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      # Supply a complete SQLAlchemy URL; do not interpolate an unescaped
      # password into a URL (reserved characters change its meaning).
      IM19_DATABASE_URL: "${IM19_DATABASE_URL:?set IM19_DATABASE_URL with a URL-encoded password}"
      IM19_BIND_HOST: 0.0.0.0
    # A trusted TLS reverse proxy must front this service. Do not expose publicly.
    ports:
      - "127.0.0.1:8000:8000"
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    pids_limit: 128
    mem_limit: 512m
    cpus: 2
    init: true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  pgdata:

