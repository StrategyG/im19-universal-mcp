services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: im19
      POSTGRES_USER: im19
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U im19"]
      interval: 10s
      timeout: 5s
      retries: 5
  gateway:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      IM19_DATABASE_URL: "postgresql+psycopg://im19:${POSTGRES_PASSWORD}@postgres:5432/im19"
      IM19_BIND_HOST: 0.0.0.0
    # A trusted TLS reverse proxy must front this service. Do not expose publicly.
    ports:
      - "127.0.0.1:8000:8000"
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp"]
volumes:
  pgdata:
