name: IM19 Security
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
permissions:
  contents: read
jobs:
  static-and-dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and security tooling
        run: python -m pip install -e ".[dev]" pip-audit bandit
      - name: Ruff lint
        run: ruff check --select F,E4,E7,E9 src tests
      - name: Bandit source scan
        run: bandit -q -r src
      - name: Audit installed Python dependencies
        run: pip-audit --progress-spinner off
