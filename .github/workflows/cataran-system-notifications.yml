name: Cataran System Change Notifications

on:
  push:
    branches: ["**"]
  pull_request:
    types: [opened, reopened, ready_for_review, closed]
  workflow_run:
    workflows: ["*"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read
  issues: write

jobs:
  notify:
    # workflow_run has a privileged token. This job reads only event metadata;
    # it never checks out code or downloads artifacts from the triggering run.
    if: \${{ github.event_name != 'workflow_run' || github.event.workflow_run.name != 'Cataran System Change Notifications' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compose change or repair notification
        id: compose
        env:
          GH_EVENT_NAME: \${{ github.event_name }}
          GH_ACTOR: \${{ github.actor }}
          GH_REF_NAME: \${{ github.ref_name }}
          GH_SERVER_URL: \${{ github.server_url }}
          GH_REPOSITORY: \${{ github.repository }}
          GH_EVENT_PATH: \${{ github.event_path }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/cataran-notification.md"
          should_notify="true"

          {
            echo "## Cataran system change notification"
            echo
            echo "- Repository: $GH_REPOSITORY"
            echo "- Event: $GH_EVENT_NAME"
            echo "- Actor: $GH_ACTOR"
            echo "- Recorded (UTC): $(date -u +'%Y-%m-%d %H:%M:%S')"
            echo
          } > "$body"

          case "$GH_EVENT_NAME" in
            push)
              before="$(jq -r '.before // ""' "$GH_EVENT_PATH")"
              after="$(jq -r '.after // ""' "$GH_EVENT_PATH")"
              deleted="$(jq -r '.deleted // false' "$GH_EVENT_PATH")"
              echo "### Code change pushed" >> "$body"
              echo "- Branch: $GH_REF_NAME" >> "$body"
              if [[ "$deleted" == "true" ]]; then
                echo "- Ref action: branch deleted" >> "$body"
              elif [[ -n "$before" && -n "$after" ]]; then
                echo "- Compare: $GH_SERVER_URL/$GH_REPOSITORY/compare/$before...$after" >> "$body"
              fi
              echo "- Commits in this push:" >> "$body"
              jq -r '
                if (.commits | length) == 0 then
                  "  - No commit details were included in the event."
                else
                  .commits[] |
                  "  - \(.id[0:7]) \(.message | split("\n")[0] | gsub("@"; "＠")) — \(((.author.name // "unknown") | gsub("@"; "＠")))"
                end
              ' "$GH_EVENT_PATH" >> "$body"
              ;;

            pull_request)
              number="$(jq -r '.pull_request.number' "$GH_EVENT_PATH")"
              title="$(jq -r '(.pull_request.title // "Untitled") | gsub("@"; "＠")' "$GH_EVENT_PATH")"
              action="$(jq -r '.action // "updated"' "$GH_EVENT_PATH")"
              merged="$(jq -r '.pull_request.merged // false' "$GH_EVENT_PATH")"
              head_repo="$(jq -r '.pull_request.head.repo.full_name // ""' "$GH_EVENT_PATH")"
              echo "### Pull request change" >> "$body"
              echo "- Pull request: #$number — $title ($GH_SERVER_URL/$GH_REPOSITORY/pull/$number)" >> "$body"
              echo "- Activity: $action" >> "$body"
              echo "- Head: $(jq -r '.pull_request.head.ref // "unknown"' "$GH_EVENT_PATH")" >> "$body"
              echo "- Base: $(jq -r '.pull_request.base.ref // "unknown"' "$GH_EVENT_PATH")" >> "$body"
              if [[ "$merged" == "true" ]]; then
                echo "- Result: merged" >> "$body"
              elif [[ "$action" == "closed" ]]; then
                echo "- Result: closed without merge" >> "$body"
              fi
              if [[ "$head_repo" != "$GH_REPOSITORY" ]]; then
                should_notify="false"
                echo >> "$body"
                echo "Notification delivery was skipped for this fork-originated PR event; the workflow does not attempt a privileged write from fork context." >> "$body"
              fi
              ;;

            workflow_run)
              run_name="$(jq -r '.workflow_run.name // "workflow"' "$GH_EVENT_PATH")"
              conclusion="$(jq -r '.workflow_run.conclusion // "unknown"' "$GH_EVENT_PATH")"
              run_url="$(jq -r '.workflow_run.html_url // ""' "$GH_EVENT_PATH")"
              run_branch="$(jq -r '.workflow_run.head_branch // "unknown"' "$GH_EVENT_PATH")"
              run_sha="$(jq -r '.workflow_run.head_sha // "unknown"' "$GH_EVENT_PATH")"
              echo "### Automated check result" >> "$body"
              echo "- Workflow: $run_name" >> "$body"
              echo "- Conclusion: $conclusion" >> "$body"
              echo "- Branch: $run_branch" >> "$body"
              echo "- Commit: $run_sha" >> "$body"
              if [[ -n "$run_url" ]]; then
                echo "- Run details: $run_url" >> "$body"
              fi
              if [[ "$conclusion" == "success" ]]; then
                should_notify="false"
                echo >> "$body"
                echo "Successful check recorded in the Actions run summary; no inbox mention was sent." >> "$body"
              else
                echo >> "$body"
                echo "Action required: inspect the failed, cancelled, or incomplete workflow run and track the repair." >> "$body"
              fi
              ;;

            workflow_dispatch)
              echo "### Manual notification test" >> "$body"
              echo "A maintainer manually requested a notification delivery test." >> "$body"
              ;;

            *)
              should_notify="false"
              echo "No notification rule is defined for this event." >> "$body"
              ;;
          esac

          if [[ "$should_notify" == "true" ]]; then
            printf '\n---\n@StrategyG\n' >> "$body"
          fi

          cat "$body" >> "$GITHUB_STEP_SUMMARY"
          echo "should_notify=$should_notify" >> "$GITHUB_OUTPUT"

      - name: Publish to the persistent GitHub change log and notify the owner
        if: steps.compose.outputs.should_notify == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: \${{ github.token }}
          GH_REPOSITORY: \${{ github.repository }}
          GH_SERVER_URL: \${{ github.server_url }}
        run: |
          set -euo pipefail
          issue_title="[Cataran] Change & Repair Notifications"
          issue_number="$(
            gh issue list \
              --repo "$GH_REPOSITORY" \
              --state open \
              --limit 100 \
              --json number,title \
              --jq '.[] | select(.title == "[Cataran] Change & Repair Notifications") | .number' \
              | head -n 1
          )"

          if [[ -z "$issue_number" ]]; then
            issue_url="$(
              gh issue create \
                --repo "$GH_REPOSITORY" \
                --title "$issue_title" \
                --body-file "$RUNNER_TEMP/cataran-notification.md"
            )"
            echo "Created persistent change log: $issue_url" >> "$GITHUB_STEP_SUMMARY"
          else
            gh issue comment "$issue_number" \
              --repo "$GH_REPOSITORY" \
              --body-file "$RUNNER_TEMP/cataran-notification.md"
            echo "Appended event to persistent change log: $GH_SERVER_URL/$GH_REPOSITORY/issues/$issue_number" >> "$GITHUB_STEP_SUMMARY"
          fi
