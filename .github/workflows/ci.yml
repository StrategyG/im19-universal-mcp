name: IM19 CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q src tests
      - name: Lint critical correctness rules
        run: ruff check --select E4,E7,E9,F63,F7,F82 src tests
      - name: Type-check authorization policy
        run: mypy --follow-imports=silent src/im19_mcp/security.py
      - name: Unit and mocked integration tests
        run: python -m pytest -q
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image (without secrets)
        run: docker build --tag im19-mcp:ci .
