name: IM19 CI
on:
  push:
    branches: [main]
  pull_request:
# Avoid duplicate push and PR checks; cancel jobs for superseded commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q src tests
      - name: Lint critical correctness rules
        run: ruff check --select E4,E7,E9,F63,F7,F82 src tests
      - name: Type-check authorization policy
        run: mypy --follow-imports=silent src/im19_mcp/security.py
      - name: Unit and mocked integration tests
        run: python -m pytest -q
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image (without secrets)
        run: docker build --tag im19-mcp:ci .

  codespaces-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exercise Codespaces postCreate bootstrap and real stdio launcher
        run: bash scripts/codespaces/bootstrap.sh
      - name: Verify user-facing MCP probe independently
        run: .venv/bin/python scripts/codespaces/probe.py
      - name: Check opt-in Codex registration script syntax
        run: bash -n scripts/codespaces/register_codex.sh
