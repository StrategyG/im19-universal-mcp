name: IM19 CI
on:
  push:
    branches: [main]
  pull_request:
# Avoid duplicate push and PR checks; cancel jobs for superseded commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -e ".[dev]" build
      - name: Dependency consistency
        run: python -m pip check
      - name: Safe diagnostics smoke test
        run: |
          im19-mcp-doctor --mode local
          if im19-mcp-doctor --mode remote; then
            echo "Unconfigured remote gateway must fail closed" >&2
            exit 1
          fi
      - name: Compile
        run: python -m compileall -q src tests
      - name: Lint critical correctness rules
        run: ruff check --select E4,E7,E9,F63,F7,F82 src tests
      - name: Type-check authorization policy
        run: mypy --follow-imports=silent src/im19_mcp/security.py
      - name: Unit and mocked integration tests
        run: python -m pytest -q
      - name: Build distribution
        run: python -m build
      - name: Install wheel in clean environment and check entrypoints
        run: |
          python -m venv /tmp/im19-wheel
          /tmp/im19-wheel/bin/pip install --require-hashes -r requirements.lock
          /tmp/im19-wheel/bin/pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/im19-wheel/bin/im19-mcp-doctor --mode local
          /tmp/im19-wheel/bin/python -c 'from im19_mcp.browser_auth import BrowserAuthorization'
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image (without secrets)
        run: docker build --tag im19-mcp:ci .
      - name: Validate managed production Compose without real secrets
        env:
          IM19_IMAGE_REF: ghcr.io/strategyg/im19-universal-mcp@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          IM19_DATABASE_URL: postgresql+psycopg://test:synthetic@db.invalid:5432/im19
          IM19_FERNET_KEY: SYNTHETIC_CI_ONLY_NOT_VALID_FERNET_KEY
          IM19_AUDIT_SALT: SYNTHETIC_CI_AUDIT_SALT_NOT_FOR_PRODUCTION
          IM19_MCP_ISSUER: https://identity.invalid/
          IM19_MCP_RESOURCE: https://mcp.invalid/mcp
          IM19_MCP_INTROSPECTION: https://identity.invalid/introspect
          IM19_MCP_CLIENT_ID: synthetic-client
          IM19_MCP_CLIENT_SECRET: synthetic-not-a-secret
        run: |
          docker compose -f compose.production.managed.yaml config --quiet
          # Never allow an unpinned mutable tag or a local build in production.
          docker compose -f compose.production.managed.yaml config --format json | python -c 'import json,sys; s=json.load(sys.stdin)["services"]["gateway"]; ref=s["image"]; assert "@sha256:" in ref and len(ref.split("@sha256:")[1])==64; assert "build" not in s'



