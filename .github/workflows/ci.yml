name: IM19 CI
on:
  push:
    branches: [main]
  pull_request:
# Avoid duplicate push and PR checks; cancel jobs for superseded commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -e ".[dev]" build
      - name: Dependency consistency
        run: python -m pip check
      - name: Safe diagnostics smoke test
        run: |
          im19-mcp-doctor --mode local
          if im19-mcp-doctor --mode remote; then
            echo "Unconfigured remote gateway must fail closed" >&2
            exit 1
          fi
      - name: Compile
        run: python -m compileall -q src tests
      - name: Lint critical correctness rules
        run: ruff check --select E4,E7,E9,F63,F7,F82 src tests
      - name: Type-check authorization policy
        run: mypy --follow-imports=silent src/im19_mcp/security.py
      - name: Unit and mocked integration tests
        run: python -m pytest -q
      - name: Build distribution
        run: python -m build
      - name: Install wheel in clean environment and check entrypoints
        run: |
          python -m venv /tmp/im19-wheel
          /tmp/im19-wheel/bin/pip install --require-hashes -r requirements.lock
          /tmp/im19-wheel/bin/pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/im19-wheel/bin/im19-mcp-doctor --mode local
          /tmp/im19-wheel/bin/python -c 'from im19_mcp.browser_auth import BrowserAuthorization'
  cloudbrowser-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned Cloudbrowser contract target
        uses: actions/checkout@v4
        with:
          repository: StrategyG/Cloudbrowser
          ref: 4d65dcd07e984591b16238fb168675d22e9326a3
          path: cloudbrowser_upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install two project packages (CI-only)
        run: |
          python -m pip install -e . -e ./cloudbrowser_upstream
      - name: Exercise actual Cloudbrowser A2A ASGI protocol
        run: python scripts/cloudbrowser_a2a_contract.py
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image (without secrets)
        run: docker build --tag im19-mcp:ci .

