name: Cataran Platform Contract Conformance
on:
  pull_request:
    paths: ["cataran/contracts/v1/**", "tests/contracts/test_cataran_event_schema.py", "requirements-cataran-contracts.txt", "docs/CATARAN_CONTRACT_CONFORMANCE.md", ".github/workflows/cataran-contracts.yml"]
  push:
    branches: ["**"]
    paths: ["cataran/contracts/v1/**", "tests/contracts/test_cataran_event_schema.py", "requirements-cataran-contracts.txt", "docs/CATARAN_CONTRACT_CONFORMANCE.md", ".github/workflows/cataran-contracts.yml"]
permissions:
  contents: read
concurrency:
  group: cataran-contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --no-input -r requirements-cataran-contracts.txt
      - run: python -m json.tool cataran/contracts/v1/platform-event.schema.json > /dev/null
      - run: python -m unittest discover -s tests/contracts -p 'test_cataran_event_schema.py' -v
