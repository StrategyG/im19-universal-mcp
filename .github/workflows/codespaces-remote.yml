name: IM19 Codespaces OAuth Stack
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  real-keycloak:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked runtime
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Start isolated PostgreSQL, Keycloak and gateway
        run: |
          python -m im19_mcp.codespaces up \
            --mcp-origin https://mcp.test --issuer-origin https://identity.test \
            --mcp-port 18000 --issuer-port 18080
      - name: Real issuer login, PKCE, code replay and gateway token verification
        run: python scripts/codespaces/probe_keycloak.py
      - name: Redacted synthetic CI diagnostics
        if: failure()
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          root = Path('.im19-codespaces')
          data = (root / 'setup.log').read_text() if (root / 'setup.log').exists() else ''
          env = {k:v for k,v in os.environ.items() if not k.startswith(('IM19_', 'KC_')) and k != 'POSTGRES_PASSWORD'}
          result = subprocess.run(['docker', 'compose', '--env-file', str(root / 'stack.env'), '-f', str(root / 'compose.json'),
                                   'logs', '--no-color', '--tail', '60', 'keycloak', 'gateway'], capture_output=True, text=True, env=env)
          data += result.stdout + result.stderr
          values = []
          if (root / 'connection.json').exists():
              values += list(json.loads((root / 'connection.json').read_text()).values())
          if (root / 'stack.env').exists():
              values += [line.split('=',1)[1] for line in (root / 'stack.env').read_text().splitlines() if '=' in line]
          for value in sorted((v for v in values if isinstance(v,str) and len(v)>8), key=len, reverse=True):
              data = data.replace(value, '[REDACTED]')
          print(data[-16000:])
          PY
      - name: Stop isolated services (preserve volumes until runner deletion)
        if: always()
        run: python -m im19_mcp.codespaces down
